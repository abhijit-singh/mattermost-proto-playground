  - id: admin.global_attributes.confirm.delete.policy_reference
    defaultMessage: '{name} applies to users. The {policy} membership policy still uses this attribute, and that policy will be flagged.'
    why: en.json admin.global_attributes.confirm.delete.body only says the definition is removed. It does not name the policy, the user scope, or that the policy will be flagged. admin.global_attributes.confirm.delete.error.has_dependents is the 409 for linked attributes and says the delete is blocked.
  - id: admin.access_control.policy.deleted_attribute.notice.title
    defaultMessage: A rule still uses a deleted attribute
    why: No policy-editor notice names a deleted attribute. The existing notices cover missing user attributes, a channel missing a value, masked values, and mixed channel types.
  - id: admin.access_control.policy.deleted_attribute.notice.text
    defaultMessage: '{name} no longer exists. Edit or remove the marked rule.'
    why: No en.json string says a rule still names an attribute that was deleted, or tells the admin to edit or remove that rule, without claiming who can access a channel.
  - id: admin.access_control.policy.deleted_attribute.list_tag
    defaultMessage: Uses a deleted attribute
    why: The Membership Policies list has no warning tag. No en.json string is a text indicator for one policy that still names a deleted attribute.
  - id: admin.access_control.policy.deleted_attribute.rule_tag
    defaultMessage: Deleted attribute
    why: No en.json tag marks a single rule whose attribute was deleted. The list tag is a different sentence, so this shorter row mark is separate.
  - id: admin.global_attributes.deleted.notice.title
    defaultMessage: '{policy} still uses {name}'
    why: No en.json string names the membership policy that still uses an attribute after that attribute is deleted. admin.global_attributes.confirm.delete.body does not mention a policy.
  - id: admin.global_attributes.deleted.notice.text
    defaultMessage: '{name} deleted. 1 membership policy still uses it.'
    why: No en.json string announces a completed attribute delete together with the count of membership policies that still name it. A toast that only says deleted would hide the next step.
  - id: admin.global_attributes.deleted.view_policy
    defaultMessage: View flagged policy
    why: No en.json string is the next step from Attribute Management to the one membership policy that still names the deleted attribute.
  - id: admin.global_attributes.confirm.delete.error.still_listed.title
    defaultMessage: Could not delete {name}
    why: admin.global_attributes.confirm.delete.error.generic does not name the attribute. The 409 title does not exist; that string is about linked attributes, not a failed delete that leaves the row in place.
  - id: admin.global_attributes.confirm.delete.error.still_listed.text
    defaultMessage: '{name} is still in the list. Open its actions and choose Delete attribute to try again.'
    why: admin.global_attributes.confirm.delete.error.generic says "Please try again" and does not say the row is still there or which control retries the delete.
